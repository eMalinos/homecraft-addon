# Dev tooling only; the add-on image installs homecraft_connector/requirements.txt.
[tool.pytest.ini_options]
pythonpath = ["homecraft_connector"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["connector"]
