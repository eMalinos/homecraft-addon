name: Homecraft Connector
description: Připojí Home Assistant k Homecraftu odchozím spojením (bez veřejné adresy a VPN).
version: "0.2.0"
slug: homecraft_connector
url: https://github.com/eMalinos/homecraft-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/emalinos/homecraft-connector-{arch}
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - type: homeassistant_config
    read_only: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-export-outline
panel_title: Homecraft
# The Cloudflare Access token is not an option: the YAML view of the options
# shows values. It is entered in the panel and kept in /data/cf_access.json.
options:
  server_url: wss://agent.homecraft.cz/api/agent/ws
  paused: false
schema:
  server_url: url
  paused: bool
