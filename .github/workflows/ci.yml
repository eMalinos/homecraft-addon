name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Ruff
        run: |
          uvx ruff@0.17.4 check .
          uvx ruff@0.17.4 format --check .
      - name: Pytest
        run: >-
          uv run --python 3.12 --no-project --with pytest==9.2.0
          --with-requirements homecraft_connector/requirements.txt pytest -q
